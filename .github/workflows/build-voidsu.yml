name: Build VoidSU

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spoofed: [ false ]

    defaults:
      run:
        working-directory: ./manager

    env:
      KEYSTORE_BASE64: ${{ secrets.VOIDSU_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.VOIDSU_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.VOIDSU_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.VOIDSU_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "Setting up keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup cargo-ndk
        run: cargo install cargo-ndk

      - name: Build ksud binary for arm64-v8a
        run: |
          cd ../userspace/ksud
          cargo ndk -t arm64-v8a -o ../manager/app/src/main/jniLibs build --release
          if [ -f ../manager/app/src/main/jniLibs/arm64-v8a/ksud ]; then
            mv ../manager/app/src/main/jniLibs/arm64-v8a/ksud ../manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          generate-job-summary: true

      - name: Build with Gradle
        run: ./gradlew assembleRelease --build-cache

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidSU-Manager
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v4
        with:
          name: VoidSU-Mappings
          path: "manager/app/build/outputs/mapping/release/"
